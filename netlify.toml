[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Ne pas scanner les fichiers .env (secrets gérés via Netlify UI / CLI)
  SECRETS_SCAN_OMIT_PATHS = ".env,.env.*,.env.local,.env.local.example"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA Vue Router — les routes /api/* sont gérées par la Function (path config)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
